<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ShopHub - Modern e-commerce product catalog">
<title>ShopHub | Product Catalog</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --primary:#6366f1;
 --primary-dark:#4f46e5;
 --dark:#111827;
 --gray:#6b7280;
 --light:#f3f4f6;
 --white:#fff;
 --green:#16a34a;
 --red:#dc2626;
 --shadow:0 8px 30px rgba(0,0,0,.08);
}
body{
 font-family:Inter,Arial,sans-serif;
 background:#f8fafc;
 color:var(--dark);
 line-height:1.5;
}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.navbar{
 position:sticky;
 top:0;
 z-index:100;
 background:rgba(255,255,255,.95);
 backdrop-filter:blur(10px);
 border-bottom:1px solid #e5e7eb;
}
.nav-inner{
 max-width:1150px;
 margin:auto;
 height:70px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
}
.logo{
 font-size:24px;
 font-weight:800;
 color:var(--primary);
}
.nav-links{
 display:flex;
 gap:25px;
 align-items:center;
}
.nav-links a{
 font-weight:600;
 color:#374151;
}
.nav-links a:hover{color:var(--primary)}
.cart-btn{
 border:0;
 background:var(--dark);
 color:white;
 padding:10px 16px;
 border-radius:10px;
 font-weight:700;
}
.cart-count{
 background:#ef4444;
 padding:2px 7px;
 border-radius:20px;
 margin-left:4px;
}

.container{
 max-width:1150px;
 margin:auto;
 padding:30px 20px;
}

.hero{
 background:linear-gradient(135deg,#4f46e5,#7c3aed);
 color:white;
 border-radius:25px;
 padding:55px 40px;
 margin-bottom:35px;
 overflow:hidden;
}
.hero h1{
 font-size:clamp(34px,6vw,60px);
 line-height:1.05;
 max-width:650px;
 margin-bottom:18px;
}
.hero p{
 font-size:18px;
 opacity:.9;
 max-width:600px;
 margin-bottom:25px;
}
.btn{
 border:0;
 border-radius:10px;
 padding:12px 20px;
 font-weight:700;
 transition:.2s;
}
.btn-primary{
 background:white;
 color:var(--primary-dark);
}
.btn-dark{
 background:var(--dark);
 color:white;
}
.btn-primary:hover,.btn-dark:hover{
 transform:translateY(-2px);
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}
.section-title h2{font-size:28px}

.controls{
 display:flex;
 gap:12px;
 margin-bottom:25px;
 flex-wrap:wrap;
}
.search{
 flex:1;
 min-width:220px;
 padding:13px 16px;
 border:1px solid #d1d5db;
 border-radius:10px;
 outline:none;
 background:white;
}
.search:focus{border-color:var(--primary)}
select{
 padding:13px 16px;
 border:1px solid #d1d5db;
 border-radius:10px;
 background:white;
 outline:none;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
}
.product{
 background:white;
 border-radius:18px;
 overflow:hidden;
 box-shadow:var(--shadow);
 transition:.25s;
 border:1px solid #eef0f3;
}
.product:hover{
 transform:translateY(-5px);
 box-shadow:0 15px 35px rgba(0,0,0,.12);
}
.product-img{
 height:210px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#f1f5f9;
 font-size:90px;
}
.product-info{padding:18px}
.category{
 font-size:12px;
 color:var(--primary);
 text-transform:uppercase;
 font-weight:800;
 letter-spacing:.5px;
}
.product h3{
 font-size:18px;
 margin:6px 0;
}
.product p{
 color:var(--gray);
 font-size:14px;
 min-height:42px;
}
.price{
 font-size:21px;
 font-weight:800;
 margin:13px 0;
}
.product-actions{
 display:flex;
 gap:8px;
}
.product-actions button{flex:1}

.details{
 background:white;
 border-radius:20px;
 padding:30px;
 box-shadow:var(--shadow);
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:35px;
}
.detail-img{
 min-height:400px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#f1f5f9;
 border-radius:18px;
 font-size:150px;
}
.detail-info h1{
 font-size:40px;
 margin:10px 0;
}
.detail-price{
 font-size:32px;
 font-weight:800;
 color:var(--primary);
 margin:20px 0;
}
.detail-info p{
 color:var(--gray);
 margin-bottom:20px;
}
.specs{
 margin:25px 0;
 border-top:1px solid #e5e7eb;
}
.spec{
 display:flex;
 justify-content:space-between;
 padding:12px 0;
 border-bottom:1px solid #e5e7eb;
}

.cart{
 background:white;
 padding:25px;
 border-radius:20px;
 box-shadow:var(--shadow);
}
.cart-item{
 display:flex;
 gap:20px;
 align-items:center;
 padding:18px 0;
 border-bottom:1px solid #e5e7eb;
}
.cart-icon{
 width:80px;
 height:80px;
 background:#f1f5f9;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:12px;
 font-size:40px;
}
.cart-item-info{flex:1}
.qty{
 display:flex;
 align-items:center;
 gap:10px;
}
.qty button{
 width:32px;
 height:32px;
 border:1px solid #ddd;
 background:white;
 border-radius:7px;
}
.remove{
 border:0;
 background:none;
 color:var(--red);
 font-weight:700;
}
.total{
 text-align:right;
 padding-top:25px;
}
.total h2{margin-bottom:15px}

.empty{
 text-align:center;
 padding:60px 20px;
 color:var(--gray);
}
.empty h2{color:var(--dark);margin-bottom:10px}

.not-found{
 text-align:center;
 padding:100px 20px;
}

footer{
 margin-top:60px;
 background:#111827;
 color:white;
 padding:35px 20px;
 text-align:center;
}
footer p{color:#9ca3af;margin-top:8px}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#111827;
 color:white;
 padding:14px 20px;
 border-radius:10px;
 transform:translateY(100px);
 opacity:0;
 transition:.3s;
 z-index:999;
}
.toast.show{
 transform:translateY(0);
 opacity:1;
}

@media(max-width:900px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
 .nav-links a{display:none}
 .hero{padding:40px 25px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .details{grid-template-columns:1fr}
 .detail-img{min-height:280px}
 .detail-info h1{font-size:30px}
}
@media(max-width:480px){
 .container{padding:20px 14px}
 .grid{grid-template-columns:1fr}
 .controls{flex-direction:column}
 .search,select{width:100%}
 .cart-item{flex-wrap:wrap}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="nav-inner">
<a href="#/" class="logo">ShopHub</a>

<div class="nav-links">
<a href="#/">Home</a>
<a href="#/products">Products</a>
<a href="#/about">About</a>
</div>

<a href="#/cart">
<button class="cart-btn">
🛒 Cart <span class="cart-count" id="cartCount">0</span>
</button>
</a>
</div>
</nav>

<main class="container" id="app"></main>

<footer>
<h3>ShopHub</h3>
<p>Modern e-commerce product catalog</p>
<p>© 2026 ShopHub. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ================================
   PRODUCT DATA
================================ */

const products=[
{
 id:1,
 name:"Pro Wireless Headphones",
 category:"Electronics",
 price:129.99,
 icon:"🎧",
 description:"Premium wireless headphones with active noise cancellation and crystal-clear sound.",
 color:"#e0e7ff",
 specs:["Wireless","40-hour battery","Noise cancellation"]
},
{
 id:2,
 name:"Smart Watch X2",
 category:"Electronics",
 price:89.99,
 icon:"⌚",
 description:"Modern smartwatch with fitness tracking, notifications and health monitoring.",
 color:"#dcfce7",
 specs:["AMOLED display","7-day battery","Fitness tracking"]
},
{
 id:3,
 name:"Urban Backpack",
 category:"Fashion",
 price:54.99,
 icon:"🎒",
 description:"Durable everyday backpack with a laptop compartment and modern design.",
 color:"#fef3c7",
 specs:["Water resistant","Laptop compartment","25L capacity"]
},
{
 id:4,
 name:"Running Shoes",
 category:"Fashion",
 price:74.99,
 icon:"👟",
 description:"Lightweight running shoes designed for comfort and everyday performance.",
 color:"#fee2e2",
 specs:["Breathable mesh","Cushioned sole","Lightweight"]
},
{
 id:5,
 name:"Mechanical Keyboard",
 category:"Electronics",
 price:99.99,
 icon:"⌨️",
 description:"Tactile mechanical keyboard with RGB lighting and programmable keys.",
 color:"#e0f2fe",
 specs:["Mechanical switches","RGB lighting","USB-C"]
},
{
 id:6,
 name:"Travel Coffee Mug",
 category:"Lifestyle",
 price:24.99,
 icon:"☕",
 description:"Insulated stainless steel travel mug that keeps drinks hot or cold.",
 color:"#fce7f3",
 specs:["Stainless steel","Leak resistant","350ml"]
},
{
 id:7,
 name:"Minimal Desk Lamp",
 category:"Home",
 price:44.99,
 icon:"💡",
 description:"Elegant LED desk lamp with adjustable brightness and color temperature.",
 color:"#fef9c3",
 specs:["LED","Adjustable","USB powered"]
},
{
 id:8,
 name:"Premium Sunglasses",
 category:"Fashion",
 price:39.99,
 icon:"🕶️",
 description:"Classic sunglasses with UV protection and a lightweight premium frame.",
 color:"#ede9fe",
 specs:["UV400","Polarized","Lightweight"]
}
];

/* ================================
   APPLICATION STATE
================================ */

let state={
 search:"",
 category:"All",
 sort:"default",
 cart:JSON.parse(localStorage.getItem("shophub-cart")||"[]")
};

/* ================================
   ROUTER
================================ */

function router(){

 const path=location.hash.slice(1)||"/";

 if(path==="/") renderHome();

 else if(path==="/products") renderProducts();

 else if(path.startsWith("/product/")){
   const id=Number(path.split("/")[2]);
   renderProduct(id);
 }

 else if(path==="/cart") renderCart();

 else if(path==="/about") renderAbout();

 else render404();
}

window.addEventListener("hashchange",router);

/* ================================
   HOME
================================ */

function renderHome(){

 document.getElementById("app").innerHTML=`

 <section class="hero">
   <h1>Everything you need, all in one place.</h1>
   <p>
   Discover carefully selected products for your technology,
   lifestyle, fashion and home needs.
   </p>
   <a href="#/products">
     <button class="btn btn-primary">Explore Products →</button>
   </a>
 </section>

 <div class="section-title">
   <h2>Featured Products</h2>
   <a href="#/products">View all →</a>
 </div>

 <div class="grid">
   ${products.slice(0,4).map(productCard).join("")}
 </div>
 `;
}

/* ================================
   PRODUCTS
================================ */

function renderProducts(){

 let list=[...products];

 if(state.search){
   list=list.filter(p=>
     p.name.toLowerCase().includes(state.search.toLowerCase()) ||
     p.category.toLowerCase().includes(state.search.toLowerCase())
   );
 }

 if(state.category!=="All"){
   list=list.filter(p=>p.category===state.category);
 }

 if(state.sort==="low"){
   list.sort((a,b)=>a.price-b.price);
 }

 if(state.sort==="high"){
   list.sort((a,b)=>b.price-a.price);
 }

 if(state.sort==="name"){
   list.sort((a,b)=>a.name.localeCompare(b.name));
 }

 document.getElementById("app").innerHTML=`

 <div class="section-title">
   <h2>All Products</h2>
   <span>${list.length} products</span>
 </div>

 <div class="controls">

   <input
     class="search"
     id="search"
     value="${state.search}"
     placeholder="🔎 Search products..."
   >

   <select id="category">
     <option>All</option>
     <option>Electronics</option>
     <option>Fashion</option>
     <option>Lifestyle</option>
     <option>Home</option>
   </select>

   <select id="sort">
     <option value="default">Sort: Featured</option>
     <option value="low">Price: Low to High</option>
     <option value="high">Price: High to Low</option>
     <option value="name">Name: A-Z</option>
   </select>

 </div>

 ${
 list.length
 ? `<div class="grid">${list.map(productCard).join("")}</div>`
 : `<div class="empty">
      <h2>No products found</h2>
      <p>Try a different search or category.</p>
    </div>`
 }
 `;

 document.getElementById("category").value=state.category;
 document.getElementById("sort").value=state.sort;

 document.getElementById("search").addEventListener("input",e=>{
   state.search=e.target.value;
   renderProducts();
   document.getElementById("search").focus();
   document.getElementById("search").setSelectionRange(
     state.search.length,state.search.length
   );
 });

 document.getElementById("category").addEventListener("change",e=>{
   state.category=e.target.value;
   renderProducts();
 });

 document.getElementById("sort").addEventListener("change",e=>{
   state.sort=e.target.value;
   renderProducts();
 });
}

/* ================================
   PRODUCT CARD
================================ */

function productCard(p){

 return `
 <article class="product">

   <a href="#/product/${p.id}">
     <div
       class="product-img"
       style="background:${p.color}"
       aria-label="${p.name}"
     >
       ${p.icon}
     </div>
   </a>

   <div class="product-info">

     <span class="category">${p.category}</span>

     <h3>${p.name}</h3>

     <p>${p.description}</p>

     <div class="price">$${p.price.toFixed(2)}</div>

     <div class="product-actions">

       <a href="#/product/${p.id}">
         <button class="btn btn-dark">Details</button>
       </a>

       <button
         class="btn btn-primary"
         onclick="addToCart(${p.id})"
       >
         Add
       </button>

     </div>

   </div>
 </article>
 `;
}

/* ================================
   PRODUCT DETAILS
================================ */

function renderProduct(id){

 const p=products.find(x=>x.id===id);

 if(!p){
   render404();
   return;
 }

 document.getElementById("app").innerHTML=`

 <div class="details">

   <div
     class="detail-img"
     style="background:${p.color}"
   >
     ${p.icon}
   </div>

   <div class="detail-info">

     <span class="category">${p.category}</span>

     <h1>${p.name}</h1>

     <div class="detail-price">
       $${p.price.toFixed(2)}
     </div>

     <p>${p.description}</p>

     <div class="specs">

       ${p.specs.map((s,i)=>`
         <div class="spec">
           <span>Feature ${i+1}</span>
           <strong>${s}</strong>
         </div>
       `).join("")}

     </div>

     <button
       class="btn btn-dark"
       onclick="addToCart(${p.id})"
     >
       🛒 Add to Cart
     </button>

     <a href="#/products">
       <button class="btn" style="margin-left:8px">
         ← Back
       </button>
     </a>

   </div>

 </div>
 `;
}

/* ================================
   CART
================================ */

function renderCart(){

 if(state.cart.length===0){

   document.getElementById("app").innerHTML=`

   <div class="empty">
     <div style="font-size:70px">🛒</div>
     <h2>Your cart is empty</h2>
     <p>Add some products to get started.</p>

     <br>

     <a href="#/products">
       <button class="btn btn-dark">
         Browse Products
       </button>
     </a>
   </div>
   `;

   return;
 }

 let total=0;

 const items=state.cart.map(item=>{

   const p=products.find(x=>x.id===item.id);

   if(!p)return "";

   total+=p.price*item.qty;

   return `
   <div class="cart-item">

     <div
       class="cart-icon"
       style="background:${p.color}"
     >
       ${p.icon}
     </div>

     <div class="cart-item-info">
       <h3>${p.name}</h3>
       <p>$${p.price.toFixed(2)}</p>
     </div>

     <div class="qty">

       <button onclick="changeQty(${p.id},-1)">
         −
       </button>

       <strong>${item.qty}</strong>

       <button onclick="changeQty(${p.id},1)">
         +
       </button>

     </div>

     <button
       class="remove"
       onclick="removeFromCart(${p.id})"
     >
       Remove
     </button>

   </div>
   `;
 }).join("");

 document.getElementById("app").innerHTML=`

 <div class="section-title">
   <h2>Shopping Cart</h2>
 </div>

 <div class="cart">

   ${items}

   <div class="total">

     <p>Subtotal</p>

     <h2>$${total.toFixed(2)}</h2>

     <button
       class="btn btn-dark"
       onclick="checkout()"
     >
       Proceed to Checkout
     </button>

   </div>

 </div>
 `;
}

/* ================================
   ABOUT
================================ */

function renderAbout(){

 document.getElementById("app").innerHTML=`

 <div class="details">

   <div>
     <div style="font-size:120px;text-align:center">
       🛍️
     </div>
   </div>

   <div class="detail-info">

     <span class="category">About ShopHub</span>

     <h1>Simple. Fast. Modern.</h1>

     <p>
       ShopHub is a demonstration e-commerce application
       built using modern frontend development techniques.
     </p>

     <p>
       It uses client-side routing, reusable product
       components, browser storage and responsive design.
     </p>

     <div class="specs">
       <div class="spec">
         <span>Frontend</span>
         <strong>HTML / CSS / JavaScript</strong>
       </div>

       <div class="spec">
         <span>Routing</span>
         <strong>Hash-based SPA</strong>
       </div>

       <div class="spec">
         <span>Storage</span>
         <strong>LocalStorage</strong>
       </div>

       <div class="spec">
         <span>Deployment</span>
         <strong>Static Hosting</strong>
       </div>
     </div>

   </div>

 </div>
 `;
}

/* ================================
   CART FUNCTIONS
================================ */

function addToCart(id){

 const existing=state.cart.find(x=>x.id===id);

 if(existing){
   existing.qty++;
 }else{
   state.cart.push({id,qty:1});
 }

 saveCart();

 showToast("Product added to cart 🛒");
}

function changeQty(id,amount){

 const item=state.cart.find(x=>x.id===id);

 if(!item)return;

 item.qty+=amount;

 if(item.qty<=0){
   state.cart=state.cart.filter(x=>x.id!==id);
 }

 saveCart();

 renderCart();
}

function removeFromCart(id){

 state.cart=state.cart.filter(x=>x.id!==id);

 saveCart();

 renderCart();

 showToast("Product removed");
}

function saveCart(){

 localStorage.setItem(
   "shophub-cart",
   JSON.stringify(state.cart)
 );

 updateCartCount();
}

function updateCartCount(){

 const count=state.cart.reduce(
   (sum,item)=>sum+item.qty,0
 );

 document.getElementById("cartCount").textContent=count;
}

function checkout(){

 alert(
  "Demo checkout: Your order has been received! 🎉"
 );
}

/* ================================
   UTILITIES
================================ */

function showToast(message){

 const toast=document.getElementById("toast");

 toast.textContent=message;
 toast.classList.add("show");

 setTimeout(()=>{
   toast.classList.remove("show");
 },2000);
}

function render404(){

 document.getElementById("app").innerHTML=`

 <div class="not-found">

   <div style="font-size:80px">🔍</div>

   <h1>Page Not Found</h1>

   <p>The page you're looking for doesn't exist.</p>

   <br>

   <a href="#/">
     <button class="btn btn-dark">
       Go Home
     </button>
   </a>

 </div>
 `;
}

/* ================================
   INITIALIZE APPLICATION
================================ */

updateCartCount();
router();

</script>

</body>
</html>
