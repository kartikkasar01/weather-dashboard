<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #cityInput {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        #searchBtn {
            padding: 0 28px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #searchBtn:hover {
            background: #1d4ed8;
        }

        #loading {
            display: none;
            text-align: center;
            color: white;
            font-size: 18px;
            margin: 20px;
        }

        #error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        #weather {
            display: none;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .location {
            text-align: center;
            margin-bottom: 30px;
        }

        .location h2 {
            font-size: 32px;
        }

        .location p {
            color: #64748b;
            margin-top: 5px;
        }

        .main-weather {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
        }

        .temperature {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .icon {
            font-size: 65px;
        }

        .temperature h3 {
            font-size: 55px;
            margin: 10px 0;
        }

        .temperature p {
            font-size: 18px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card .emoji {
            font-size: 30px;
        }

        .card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .card strong {
            font-size: 18px;
        }

        .extra {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }

        .extra span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 28px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchBtn {
                padding: 14px;
            }

            .main-weather {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .extra {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌤️ Weather Dashboard</h1>
        <p>Real-Time Weather using REST API & JavaScript</p>
    </header>

    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
        >
        <button id="searchBtn">Search</button>
    </div>

    <div id="error"></div>

    <div id="loading">
        Loading weather...
    </div>

    <div id="weather">

        <div class="location">
            <h2 id="city">--</h2>
            <p id="country">--</p>
        </div>

        <div class="main-weather">

            <div class="temperature">
                <div class="icon" id="icon">🌤️</div>

                <h3>
                    <span id="temp">--</span>°C
                </h3>

                <p id="description">--</p>
            </div>

            <div class="details">

                <div class="card">
                    <div class="emoji">💧</div>
                    <div>
                        <p>Humidity</p>
                        <strong>
                            <span id="humidity">--</span>%
                        </strong>
                    </div>
                </div>

                <div class="card">
                    <div class="emoji">💨</div>
                    <div>
                        <p>Wind Speed</p>
                        <strong>
                            <span id="wind">--</span> km/h
                        </strong>
                    </div>
                </div>

                <div class="card">
                    <div class="emoji">🌡️</div>
                    <div>
                        <p>Feels Like</p>
                        <strong>
                            <span id="feels">--</span>°C
                        </strong>
                    </div>
                </div>

                <div class="card">
                    <div class="emoji">☁️</div>
                    <div>
                        <p>Weather Code</p>
                        <strong id="code">--</strong>
                    </div>
                </div>

            </div>
        </div>

        <div class="extra">

            <div>
                <span>Latitude</span>
                <strong id="latitude">--</strong>
            </div>

            <div>
                <span>Longitude</span>
                <strong id="longitude">--</strong>
            </div>

            <div>
                <span>Timezone</span>
                <strong id="timezone">--</strong>
            </div>

        </div>

    </div>
</div>


<script>

    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");

    const weatherBox = document.getElementById("weather");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");

    async function getWeather(city) {

        loading.style.display = "block";
        weatherBox.style.display = "none";
        errorBox.style.display = "none";

        try {

            // Geocoding API
            const geoURL =
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

            const geoResponse = await fetch(geoURL);

            if (!geoResponse.ok) {
                throw new Error("Location API request failed.");
            }

            const geoData = await geoResponse.json();

            if (!geoData.results || geoData.results.length === 0) {
                throw new Error("City not found. Please enter a valid city.");
            }

            // Nested JSON object
            const location = geoData.results[0];

            const latitude = location.latitude;
            const longitude = location.longitude;
            const cityName = location.name;
            const country = location.country;
            const timezone = location.timezone;


            // Weather REST API
            const weatherURL =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;

            const weatherResponse = await fetch(weatherURL);

            if (!weatherResponse.ok) {
                throw new Error("Weather API request failed.");
            }

            const weatherData = await weatherResponse.json();

            // Nested JSON
            const current = weatherData.current;


            // Display data
            document.getElementById("city").textContent = cityName;
            document.getElementById("country").textContent = country;

            document.getElementById("temp").textContent =
                Math.round(current.temperature_2m);

            document.getElementById("humidity").textContent =
                current.relative_humidity_2m;

            document.getElementById("wind").textContent =
                current.wind_speed_10m;

            document.getElementById("feels").textContent =
                Math.round(current.apparent_temperature);

            document.getElementById("code").textContent =
                current.weather_code;

            document.getElementById("latitude").textContent =
                latitude.toFixed(2);

            document.getElementById("longitude").textContent =
                longitude.toFixed(2);

            document.getElementById("timezone").textContent =
                timezone;


            // Weather description
            const info = getWeatherInfo(current.weather_code);

            document.getElementById("description").textContent =
                info.description;

            document.getElementById("icon").textContent =
                info.icon;


            weatherBox.style.display = "block";

        } catch (error) {

            errorBox.textContent = error.message;
            errorBox.style.display = "block";

        } finally {

            loading.style.display = "none";
        }
    }


    function getWeatherInfo(code) {

        const weather = {

            0: ["Clear Sky", "☀️"],
            1: ["Mainly Clear", "🌤️"],
            2: ["Partly Cloudy", "⛅"],
            3: ["Overcast", "☁️"],
            45: ["Fog", "🌫️"],
            48: ["Fog", "🌫️"],
            51: ["Light Drizzle", "🌦️"],
            53: ["Drizzle", "🌦️"],
            55: ["Heavy Drizzle", "🌧️"],
            61: ["Light Rain", "🌧️"],
            63: ["Moderate Rain", "🌧️"],
            65: ["Heavy Rain", "🌧️"],
            71: ["Light Snow", "🌨️"],
            73: ["Moderate Snow", "🌨️"],
            75: ["Heavy Snow", "❄️"],
            80: ["Rain Showers", "🌦️"],
            81: ["Heavy Rain Showers", "🌧️"],
            82: ["Violent Rain Showers", "⛈️"],
            95: ["Thunderstorm", "⛈️"],
            96: ["Thunderstorm & Hail", "⛈️"],
            99: ["Heavy Thunderstorm", "⛈️"]

        };

        const result = weather[code] || ["Unknown Weather", "🌡️"];

        return {
            description: result[0],
            icon: result[1]
        };
    }


    // Search button
    searchBtn.addEventListener("click", () => {

        const city = cityInput.value.trim();

        if (city === "") {
            errorBox.textContent = "Please enter a city name.";
            errorBox.style.display = "block";
            return;
        }

        getWeather(city);
    });


    // Enter key
    cityInput.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
            searchBtn.click();
        }

    });


    // Default city
    getWeather("Pune");

</script>

</body>
</html>
